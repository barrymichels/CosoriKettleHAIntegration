name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,test-ha]'
      - run: pytest -q
      - run: black --check custom_components tests
      - run: ruff check custom_components tests
      - run: MYPYPATH=custom_components/cosori_kettle mypy -p cosori_kettle_ble
