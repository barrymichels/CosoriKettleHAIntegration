[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosori-kettle-ble"
version = "0.3.0"
description = "Python library for Cosori Electric Kettle BLE communication"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Barry Michels", email = "barrymichels@gmail.com"}
]
keywords = ["cosori", "kettle", "bluetooth", "ble", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=3.0.2",
    "bleak-retry-connector>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
test-ha = [
    "homeassistant==2026.9.4",
    "pytest-homeassistant-custom-component==0.13.367",
    "bleak-retry-connector==4.7.0",
    "habluetooth==6.26.11",
    "dbus-fast==5.0.22",
    "aiousbwatcher==1.1.2",
    "serialx==1.10.0",
]

[project.urls]
Homepage = "https://github.com/barrymichels/CosoriKettleHAIntegration"
Repository = "https://github.com/barrymichels/CosoriKettleHAIntegration"
Issues = "https://github.com/barrymichels/CosoriKettleHAIntegration/issues"

[tool.setuptools]
packages = ["cosori_kettle_ble"]
package-dir = {cosori_kettle_ble = "custom_components/cosori_kettle/cosori_kettle_ble"}

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "custom_components/cosori_kettle", "tests"]
asyncio_default_fixture_loop_scope = "function"
